[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliance-mcp-server"
version = "0.1.0"
description = "Compliance MCP Server — multi-lens compliance scanning over MCP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
compliance-mcp = "compliance_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
